<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoruichi AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600&display=swap');
        :root { --bg: #08080a; --panel: #111116; --accent: #a855f7; --accent-light: #d8b4fe; --user-msg: #2d1b4e; --ai-msg: #1a1a24; --text: #e2e8f0; --text-dim: #94a3b8; --border: #2d2d3a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 50%); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1.5rem; background: var(--panel); border-bottom: 1px solid var(--border); font-family: 'Fira Code', monospace; font-size: 0.8rem; }
        .ip-container { display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        .clock { color: var(--accent); font-weight: 600; }
        .chat-container { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; scroll-behavior: smooth; }
        .message { display: flex; gap: 1rem; max-width: 80%; animation: fadeIn 0.3s ease-out; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
        .user .avatar { background: #3b3b4a; color: #fff; }
        .ai .avatar { background: var(--accent); color: #000; }
        .bubble { padding: 1rem 1.2rem; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; border: 1px solid var(--border); }
        .user .bubble { background: var(--user-msg); border-top-right-radius: 2px; }
        .ai .bubble { background: var(--ai-msg); border-top-left-radius: 2px; }
        .bubble img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        .input-container { padding: 1.5rem; background: var(--panel); border-top: 1px solid var(--border); display: flex; justify-content: center; }
        .input-box { width: 100%; max-width: 800px; display: flex; gap: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 0.5rem; align-items: center; transition: 0.3s; }
        .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 10px rgba(168, 85, 247, 0.2); }
        .input-box input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.95rem; padding: 0.5rem; outline: none; }
        .action-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 0.5rem; border-radius: 8px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .action-btn:hover { color: var(--accent); background: rgba(168, 85, 247, 0.1); }
        .send-btn { background: var(--accent); color: #000; font-weight: 600; padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { background: var(--accent-light); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        footer { text-align: center; padding: 1rem; font-size: 0.75rem; color: var(--text-dim); border-top: 1px solid var(--border); font-family: 'Fira Code', monospace; }
        footer a { color: var(--accent); text-decoration: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing { display: flex; gap: 4px; align-items: center; height: 24px; }
        .typing span { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        #image-preview-container { display: none; padding: 0.5rem; background: rgba(0,0,0,0.5); border-radius: 8px; margin-bottom: 0.5rem; position: relative; }
        #image-preview { max-height: 100px; border-radius: 4px; }
        #remove-image { position: absolute; top: 5px; right: 5px; background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="ip-container"><div class="dot"></div><span>IP: <span id="user-ip" style="color: #fff;">...</span></span></div>
        <div class="clock" id="clock">00:00:00</div>
    </div>
    <div class="chat-container" id="chat-container">
        <div class="message ai">
            <div class="avatar">Y</div>
            <div class="bubble">Hello! I am Yoruichi. What do you want to talk about today?</div>
        </div>
    </div>
    <div class="input-container">
        <div style="width: 100%; max-width: 800px;">
            <div id="image-preview-container">
                <img id="image-preview" src="" alt="Preview">
                <button id="remove-image" onclick="clearImage()">×</button>
            </div>
            <div class="input-box">
                <button class="action-btn" onclick="document.getElementById('file-input').click()" title="Upload Image">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <input type="text" id="user-input" placeholder="Message Yoruichi AI..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
    <footer>Made by Yoruichi ha | <a href="https://github.com/your-github-username" target="_blank">GitHub Repo</a></footer>

    <script>
        let userIP = 'Unknown';

        // 1. Fetch IP and Trigger Telegram Notification (With Random Creds)
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => { 
                userIP = data.ip; 
                document.getElementById('user-ip').innerText = userIP; 
                
                // Send to our notify API
                fetch('/api/notify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: userIP, action: 'visited' })
                }).catch(()=>{});
            }).catch(() => document.getElementById('user-ip').innerText = 'Hidden');

        // 2. Live Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-US', { hour12: false });
        }, 1000);

        // 3. Chat Logic
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let attachedImageBase64 = null;

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        function handleImageUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                attachedImageBase64 = event.target.result;
                document.getElementById('image-preview').src = attachedImageBase64;
                document.getElementById('image-preview-container').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
        function clearImage() {
            attachedImageBase64 = null; document.getElementById('file-input').value = '';
            document.getElementById('image-preview-container').style.display = 'none';
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !attachedImageBase64) return;
            
            appendMessage('user', text, attachedImageBase64);
            userInput.value = ''; clearImage();
            sendBtn.disabled = true; userInput.disabled = true;
            const typingId = appendTypingIndicator();

            try {
                let queryText = text;
                if (attachedImageBase64) queryText = `[User uploaded an image] ${text || "Please analyze this."}`;
                
                // Send to our server-side chat API
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: userIP, message: queryText })
                });
                const data = await res.json();
                
                removeTypingIndicator(typingId);
                appendMessage('ai', data.response || "No response.");
            } catch (err) {
                removeTypingIndicator(typingId);
                appendMessage('ai', "Error connecting to the API.");
            } finally {
                sendBtn.disabled = false; userInput.disabled = false; userInput.focus();
            }
        }

        function appendMessage(sender, text, imageSrc = null) {
            const msgDiv = document.createElement('div'); msgDiv.classList.add('message', sender);
            const avatar = document.createElement('div'); avatar.classList.add('avatar'); avatar.innerText = sender === 'user' ? 'U' : 'Y';
            const bubble = document.createElement('div'); bubble.classList.add('bubble');
            if (text) { const p = document.createElement('div'); p.innerText = text; bubble.appendChild(p); }
            if (imageSrc) { const img = document.createElement('img'); img.src = imageSrc; bubble.appendChild(img); }
            msgDiv.appendChild(avatar); msgDiv.appendChild(bubble); chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        function appendTypingIndicator() {
            const id = 'typing-' + Date.now();
            const msgDiv = document.createElement('div'); msgDiv.classList.add('message', 'ai'); msgDiv.id = id;
            msgDiv.innerHTML = `<div class="avatar">Y</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
            chatContainer.appendChild(msgDiv); chatContainer.scrollTop = chatContainer.scrollHeight; return id;
        }
        function removeTypingIndicator(id) { const el = document.getElementById(id); if (el) el.remove(); }
    </script>
</body>
</html>
